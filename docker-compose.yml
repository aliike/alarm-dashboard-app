services:
  backend:
    build: ./backend
    volumes:
      - ./data:/data
    environment:
      - DATABASE_PATH=/data/alarm_dashboard.db
    env_file:
      - .env
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
